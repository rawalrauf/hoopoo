# Lock screen after 2.5 minutes of idle
timeout 150 'hoopoo-system-lock'

# Turn displays off after 5 minutes of idle, turn them back on resume
timeout 300 'hoopoo-brightness-keyboard off && hoopoo-brightness-display off' resume 'hoopoo-system-wake'

# Lock before suspend, skip if hibernating; turn off keyboard backlight to save state for restore on resume
before-sleep 'hoopoo-brightness-keyboard off; [[ -f /tmp/hoopoo-hibernating ]] && rm -f /tmp/hoopoo-hibernating || HOOPOO_LOCK_ONLY=true hoopoo-system-lock'
after-resume 'sleep 1 && hoopoo-system-wake'
